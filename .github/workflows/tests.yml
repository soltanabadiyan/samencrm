name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Data pipeline rules
        run: |
          pip install -q python-calamine
          python3 -m unittest discover -s tests -v
      - name: Jalali conversion
        run: node modules/PersianCalendar/tests/convert.test.js
      - name: Persian language pack (placeholders, HTML, no missing strings)
        run: python3 i18n/build_langpack.py --strict
      - name: Academy lessons build
        run: python3 modules/SamenAcademy/tools/lessons/build_all.py && git diff --exit-code -- modules/SamenAcademy
      - name: Deploy scripts and server.env loaders
        run: bash tests/server_env.test.sh
      - name: PHP syntax
        run: |
          git ls-files '*.php' '*.service' ':!i18n/source' | while read -r f; do php -l "$f" > /dev/null || exit 1; done
      - name: Python syntax
        run: git ls-files '*.py' | xargs python3 -m py_compile
